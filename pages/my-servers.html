<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMP Multiverse — Мои серверы</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/servers.css">
    <script defer src="../js/page-transition.js"></script>
</head>
<body>
    <main class="page-shell">
        <header class="page-topbar">
            <h1 class="page-topbar-title">SMP Multiverse</h1>
            <nav class="page-topbar-nav" aria-label="Навигация">
                <a class="topbar-link" href="../index.html">Карта</a>
                <a class="topbar-link" href="./profile.html">Профиль</a>
            </nav>
        </header>

        <section class="servers-page" aria-labelledby="serversTitle">
            <header class="servers-header">
                <h2 id="serversTitle" class="servers-title">Мои серверы</h2>
                <button id="addServerBtn" class="add-server-btn" type="button">+ Добавить сервер</button>
            </header>

            <div id="serversGrid" class="servers-grid" aria-live="polite"></div>

            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon" aria-hidden="true">🪐</div>
                <h3>У вас пока нет серверов</h3>
                <p>Создайте первый сервер и выберите планету.</p>
                <button id="emptyCreateBtn" class="primary-btn" type="button">Создать первый сервер</button>
            </div>
        </section>
    </main>

    <div id="createServerModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="createServerTitle">
            <div class="modal-header">
                <h2 id="createServerTitle">Создание сервера</h2>
                <button id="closeServerModal" class="icon-btn" type="button" aria-label="Закрыть">✕</button>
            </div>
            <form id="createServerForm" class="server-form">
                <label class="field-label">
                    Название
                    <input type="text" name="name" maxlength="50" required>
                </label>

                <label class="field-label">
                    Описание
                    <textarea name="description" rows="3" maxlength="220"></textarea>
                </label>

                <label class="field-label">
                    Планета
                    <div class="planet-picker-row">
                        <img id="planetPreview" src="" alt="Предпросмотр планеты">
                        <button id="pickPlanetBtn" class="secondary-btn" type="button">Редактировать планету</button>
                    </div>
                </label>

                <label class="field-label">
                    Версия
                    <select id="serverVersion" name="version"></select>
                </label>

                <label class="field-label">
                    Ядро
                    <select id="serverCore" name="core"></select>
                </label>

                <label class="field-label">
                    Ссылка на анкету
                    <input type="url" name="questionnaireUrl" placeholder="https://...">
                </label>

                <div class="form-actions">
                    <button class="secondary-btn" type="button" id="closeServerModalSecondary">Отмена</button>
                    <button class="primary-btn" type="submit" id="saveServerBtn">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <div id="planetModal" class="modal hidden" aria-hidden="true">
        <div class="planet-modal-content" role="dialog" aria-modal="true" aria-label="Генератор планет">
            <div class="planet-editor-layout">
                <div class="planet-editor-preview-wrap">
                    <div id="planetPreviewDetailControls" class="planet-preview-detail-controls" aria-label="Детализация предпросмотра">
                        <span class="planet-preview-detail-label" aria-hidden="true">Детализация</span>
                        <button type="button" class="detail-level-btn is-active" data-preview-detail-level="1" data-tooltip="16×16" aria-pressed="true">1</button>
                        <button type="button" class="detail-level-btn" data-preview-detail-level="2" data-tooltip="32×32" aria-pressed="false">2</button>
                        <button type="button" class="detail-level-btn" data-preview-detail-level="3" data-tooltip="64×64" aria-pressed="false">3</button>
                        <button type="button" class="detail-level-btn" data-preview-detail-level="4" data-tooltip="128×128" aria-pressed="false">4</button>
                    </div>
                    <div id="planetLightControl" class="planet-light-control" aria-label="Источник освещения">
                        <div id="planetLightOrbit" class="planet-light-orbit" role="slider" aria-label="Положение источника света" aria-valuemin="0" aria-valuemax="360" aria-valuenow="315" tabindex="0">
                            <span id="planetLightHandle" class="planet-light-handle" aria-hidden="true"></span>
                        </div>
                    </div>
                    <div class="planet-axis-tilt-panel" aria-label="Угол наклона оси вращения">
                        <div class="planet-axis-tilt-slider-wrap">
                            <input id="planetAxisTiltSlider" class="planet-axis-tilt-slider" type="range" min="0" max="180" step="0.01" value="23.44" aria-label="Ползунок наклона оси в градусах">
                        </div>
                        <div id="planetAxisTiltControl" class="planet-axis-tilt-control">
                            <canvas id="planetAxisTiltCanvas" class="planet-axis-tilt-canvas" width="108" height="108" aria-hidden="true"></canvas>
                            <label class="planet-axis-tilt-label" for="planetAxisTiltInput">
                                Наклон оси
                            </label>
                            <div class="planet-axis-tilt-input-row">
                                <input id="planetAxisTiltInput" class="planet-axis-tilt-input" type="number" min="0" max="180" step="0.01" value="23.44" aria-label="Угол наклона оси в градусах">
                                <span class="planet-axis-tilt-unit">°</span>
                            </div>
                        </div>
                    </div>
                    <div class="planet-axis-planet-overlay" aria-hidden="true">
                        <span class="planet-axis-planet-line"></span>
                    </div>
                    <div id="planetCubePreview" class="planet-cube-wrapper" aria-label="3D предпросмотр кубической планеты">
                        <canvas id="planetFaceFront" class="planet-cube-face face-front" width="32" height="32"></canvas>
                        <canvas id="planetFaceBack" class="planet-cube-face face-back" width="32" height="32"></canvas>
                        <canvas id="planetFaceLeft" class="planet-cube-face face-left" width="32" height="32"></canvas>
                        <canvas id="planetFaceRight" class="planet-cube-face face-right" width="32" height="32"></canvas>
                        <canvas id="planetFaceTop" class="planet-cube-face face-top" width="32" height="32"></canvas>
                        <canvas id="planetFaceBottom" class="planet-cube-face face-bottom" width="32" height="32"></canvas>
                    </div>
                    <div class="planet-preview-zoom-controls" aria-label="Масштаб превью">
                        <button id="planetPreviewZoomIn" class="map-zoom-btn" aria-label="Приблизить планету" title="Приблизить" data-tooltip="приблизить">
                            <img src="../assets/Lucid_V1.2_icons/PNG/Flat/32/Magnifying-Glass-Add.png" alt="" class="map-zoom-icon" width="20" height="20">
                        </button>
                        <button id="planetPreviewZoomOut" class="map-zoom-btn" aria-label="Отдалить планету" title="Отдалить" data-tooltip="отдалить">
                            <img src="../assets/Lucid_V1.2_icons/PNG/Flat/32/Magnifying-Glass-Reduce.png" alt="" class="map-zoom-icon" width="20" height="20">
                        </button>
                    </div>
                    <canvas id="planetEditorCanvas" class="planet-editor-capture" width="400" height="400" aria-label="Предпросмотр планеты"></canvas>
                </div>
                <div class="planet-editor-controls">
                    <label class="field-label">
                        Seed
                        <input type="number" id="planetSeed" min="1" max="999999" step="1">
                    </label>
                    <label class="field-label">
                        Биом / палитра
                        <select id="planetPalette">
                            <option value="earth">Земная</option>
                            <option value="lava">Лавовая</option>
                            <option value="ice">Ледяная</option>
                            <option value="desert">Пустынная</option>
                            <option value="dark">Тёмная</option>
                        </select>
                    </label>
                    <label class="field-label">
                        Палитра (6 цветов)
                        <div class="planet-palette-row" role="group" aria-label="Палитра планеты">
                            <input type="color" class="planet-palette-swatch" id="planetOceanColor1" value="#1d3f66" title="Океан: глубокий" aria-label="Океан: глубокий">
                            <input type="color" class="planet-palette-swatch" id="planetOceanColor2" value="#26547f" title="Океан: средний" aria-label="Океан: средний">
                            <input type="color" class="planet-palette-swatch" id="planetOceanColor3" value="#2f6aa3" title="Океан: мелкий" aria-label="Океан: мелкий">
                            <input type="color" class="planet-palette-swatch" id="planetLandColor1" value="#3f6c2f" title="Материк: низины" aria-label="Материк: низины">
                            <input type="color" class="planet-palette-swatch" id="planetLandColor2" value="#6ea24c" title="Материк: равнины" aria-label="Материк: равнины">
                            <input type="color" class="planet-palette-swatch" id="planetLandColor3" value="#9bc27f" title="Материк: вершины" aria-label="Материк: вершины">
                        </div>
                    </label>
                    <label class="field-label">
                        Масштаб континентов
                        <input type="range" id="planetScale" min="120" max="340" step="1">
                    </label>
                    <label class="field-label">
                        Уровень моря
                        <input type="range" id="planetSeaLevel" min="25" max="80" step="1">
                    </label>
                    <label class="field-label">
                        Плотность облаков
                        <input type="range" id="planetCloudDensity" min="0" max="100" step="1">
                    </label>
                    <label class="field-label">
                        Атмосфера
                        <input type="range" id="planetAtmosphere" min="0" max="100" step="1">
                    </label>
                    <label class="field-label">
                        Размер внешнего слоя облаков
                        <input type="range" id="planetAtmosphereSize" min="0" max="35" step="1" value="5">
                    </label>
                    <label class="field-label">
                        Кольцо
                        <select id="planetRingType">
                            <option value="none">Нет</option>
                            <option value="thin">Тонкое</option>
                            <option value="wide">Широкое</option>
                        </select>
                    </label>
                    <button id="randomPlanetBtn" class="secondary-btn" type="button">Случайная планета</button>
                </div>
            </div>
            <div class="planet-modal-actions">
                <p class="planet-modal-note">Cube-генерация: бесшовный 3D-noise + псевдо-3D canvas preview.</p>
                <div class="planet-modal-buttons">
                    <button id="closePlanetModal" class="secondary-btn" type="button">Отмена</button>
                    <button id="applyPlanetBtn" class="primary-btn" type="button">Сохранить планету</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/servers.js"></script>
</body>
</html>
